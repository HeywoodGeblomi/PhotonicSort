[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "photonic-sort"
version = "1.0.0"
description = "Adaptive hybrid sort inspired by negative-time photon experiments. Give everything. Take nothing. Become photonic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "PhotonicSort Team (Grok, Harper, Benjamin, Lucas, Heywood Geblomi)" }
]
keywords = ["sorting", "adaptive", "hybrid", "photonic", "algorithms"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/HeywoodGeblomi/PhotonicSort"
Repository = "https://github.com/HeywoodGeblomi/PhotonicSort"
Related = "https://github.com/HeywoodGeblomi/GeblomiSort"

[project.scripts]
photonic-sort-demo = "photonic_sort:demo"

[tool.setuptools]
py-modules = ["photonic_sort"]
