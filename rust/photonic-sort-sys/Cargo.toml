[package]
name = "photonic-sort-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Low-level FFI bindings to PhotonicSort C11 (v1.3.1-c)"
readme = "README.md"
keywords = ["sort", "ffi", "photonic", "adaptive"]
categories = ["algorithms", "external-ffi-bindings"]
links = "photonic_sort"
build = "build.rs"
include = [
    "src/**",
    "build.rs",
    "vendor/**",
    "README.md",
    "LICENSE",
]

[features]
default = ["vendored"]
# Compile the C sources shipped under vendor/ (or monorepo ../../c fallback).
vendored = []

[build-dependencies]
cc = "1.0"
